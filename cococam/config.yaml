name: COCOCAM à la demande
version: "0.1.9"
image: ghcr.io/ozanges/cococam-ha
slug: cococam
description: Direct COCOCAM à durée limitée, depuis Home Assistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: COCOCAM
panel_admin: true
services:
  - mqtt:want
options:
  email: ""
  password: ""
  camera_name: ""
  country: FR
  phone_code: "33"
  live_seconds: 60
  battery_mqtt: false
schema:
  email: "str"
  password: "password"
  camera_name: "str?"
  country: "match(^[A-Z]{2}$)"
  phone_code: "match(^[0-9]{1,4}$)"
  live_seconds: "int(15,300)"
  battery_mqtt: "bool"
