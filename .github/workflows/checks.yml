name: Vérifications

on:
  pull_request:
  workflow_call:
    inputs:
      source:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - name: Construire le conteneur
        run: |
          docker build --platform "${{ matrix.platform }}" -t cococam-ha:ci cococam
      - name: Vérifier le JavaScript
        run: |
          node --check cococam/bridge/static/panel.js
          node --check dashboard/cococam-card.js
      - name: Tester la session et les deux flux HLS
        run: |
          docker run --rm --network none -e COCOCAM_MEDIA_TEST=1 \
            -e PYTHONPATH=/opt/cococam -v "$PWD:/workspace:ro" -w /workspace \
            cococam-ha:ci python -m unittest discover -s tests -v
      - name: Tester la carte dans Chromium
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm -e PYTHONPATH=/workspace/cococam -v "$PWD:/workspace:ro" -w /workspace \
            mcr.microsoft.com/playwright/python:v1.51.0-noble bash -c \
            'pip -q install aiohttp==3.13.5 playwright==1.51.0 && python tests/browser_card.py'
