name: Publier l’image

on:
  push:
    branches: [main]
    paths: [cococam/config.yaml, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-cococam-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Construire, tester et publier la variante
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          HA_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version: "/ {print $2}' cococam/config.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="$IMAGE:$version-$HA_ARCH"
          docker build --platform "$PLATFORM" \
            --label io.hass.type=app --label "io.hass.arch=$HA_ARCH" \
            --label "io.hass.version=$version" \
            --label "io.hass.name=COCOCAM à la demande" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$tag" cococam
          docker run --rm --network none -e COCOCAM_MEDIA_TEST=1 \
            -e PYTHONPATH=/opt/cococam -v "$PWD:/workspace:ro" -w /workspace \
            "$tag" python -m unittest discover -s tests -v
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$tag"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publier le tag multiarchitecture
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version: "/ {print $2}' cococam/config.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$version" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-aarch64"
          docker buildx imagetools inspect "$IMAGE:$version"
